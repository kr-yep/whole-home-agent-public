<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whole Home Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<canvas id="stage"></canvas>
<div id="avatar-fallback" style="position:fixed;right:8%;top:30%;font-size:clamp(50px,12vw,150px);text-align:center" aria-label="家庭助手">🏠<p style="font-size:18px">家庭助手 · 展示模式</p></div>

<div id="bubble" hidden></div>

<aside id="panel">
  <header>
    <div class="title-row">
      <h1>Whole Home Agent</h1>
      <button id="tts-toggle" class="tts-btn" type="button" title="切換語音朗讀">🔈 語音：關</button>
      <a class="page-link" href="/camera">攝影機 →</a>
    </div>
    <p class="scope">合成影片記憶 × 模擬家電控制 × 語音問答</p>
  </header>

  <div id="cast" class="cast" aria-label="選擇角色"></div>

  <!-- 智慧家庭即時狀態列 -->
  <div class="device-section">
    <div class="section-label">🏠 模擬家電狀態</div>
    <div id="device-bar" class="device-bar"></div>
  </div>

  <!-- 快捷指令分組 Chips -->
  <div id="chips-container" class="chips-container">
    <div class="chip-group">
      <span class="group-label">🏠 家電</span>
      <div id="action-chips" class="chip-list"></div>
    </div>
    <div class="chip-group">
      <span class="group-label">🔍 記憶</span>
      <div id="entity-chips" class="chip-list"></div>
    </div>
    <div class="chip-group">
      <span class="group-label">🌸 互動</span>
      <div id="persona-chips" class="chip-list"></div>
    </div>
  </div>

  <div id="log" class="log"></div>

  <form id="ask" autocomplete="off">
    <input id="question" type="text" placeholder="問「鑰匙在哪」或吩咐「開客廳冷氣」「開燈」「拉開窗簾」">
    <button type="submit" id="send">吩咐</button>
  </form>

  <p class="foot">拖曳可以移動角色 · 滾輪縮放 · 雙擊復原站位</p>
  <p id="character-credit" class="foot"></p>
  <p class="foot">離線展示 · 家電操作僅模擬 · 未連接真實攝影機或設備</p>
</aside>

<script src="/vendor/live2dcubismcore.min.js"></script>
<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/cubism4.min.js"></script>
<script src="/characters.js"></script>
<script src="/app.js"></script>
</body>
</html>
