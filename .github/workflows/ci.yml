name: B0 conformance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: b0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run B0 tests
        run: python -m unittest discover -s tests -v

      - name: Run golden CLI smoke
        run: >-
          whole-home-agent replay
          examples/fixtures/b0_key_bag_sofa_v1.json
          --entity key
          --as-of 2
          --run-id ci-${{ matrix.python-version }}

  video-contract:
    name: Prerecorded D0 video contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.24

      - name: Synchronize locked video contract dependencies
        run: uv sync --frozen --extra video

      - name: Run prerecorded perception contract tests
        run: .venv/bin/python -m unittest discover -s tests -p "test_b1_*.py" -v

      - name: Run deterministic vector D1 substrate tests
        run: .venv/bin/python -m unittest tests.test_m18_vector_d1_slice -v

      - name: Audit public release contents
        run: .venv/bin/python tools/audit_public_release.py

  demo:
    name: Closed public demo
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.24

      - name: Synchronize locked demo dependencies
        run: uv sync --frozen --extra demo

      - name: Test CLI and Streamlit presentation
        run: .venv/bin/python -m unittest tests.test_public_demo -v

      - name: Run compact prerecorded CLI smoke
        run: >-
          .venv/bin/whole-home-agent demo-recorded --compact
          --run-id ci-public-demo

      - name: Audit public release contents
        run: .venv/bin/python tools/audit_public_release.py
