add_presentation_field = true
retain_answer_field = true
retain_answer_summary_field = true
answer_summary_equals_presentation_text = true
structured_answer_survives_fallback = true
streamlit_displays_the_exact_returned_language_context = true
composition_root_selects_only_deterministic_presenter = true

[verification]
