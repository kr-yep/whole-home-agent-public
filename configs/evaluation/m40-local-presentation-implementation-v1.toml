allowed_epistemic_statuses = ["reported", "estimated"]
identifier_pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
extra_or_malformed_fields_fail_to_fallback = true

[output_contract]
exact_fields = ["schema", "status", "presenter_id", "context_schema", "text", "fallback_used", "failure_code"]
presented_status = "PRESENTED"
fallback_status = "FALLBACK"
empty_non_string_overlong_or_control_output_fails_to_fallback = true
exception_text_may_leave_boundary = false
model_or_presenter_output_is_authority = false

[wording_contract]
found_chain_uses_only_active_inside_and_at_zone_relations = true
temporal_put_move_or_sequence_claim_allowed = false
unknown_conflict_or_scope_failure_names_status_and_abstains = true
raw_evidence_claim_run_or_source_identifiers_allowed = false

