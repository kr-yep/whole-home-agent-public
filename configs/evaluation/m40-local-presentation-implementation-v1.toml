[input_contract]
source = "build_llm_text_context"
exact_top_level_fields = ["schema", "purpose", "answer", "relation_facts"]
exact_answer_fields = ["subject_id", "status", "location_id", "epistemic_status"]
exact_relation_fields = ["subject_id", "predicate", "object_id", "epistemic_status"]
